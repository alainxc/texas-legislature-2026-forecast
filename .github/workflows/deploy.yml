name: Deploy latest site zip to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick the most recently committed site-*.zip in the repo root
        id: pick
        run: |
          set -e
          latest=""; latest_ts=0
          for z in site-*.zip *.zip; do
            [ -f "$z" ] || continue
            ts=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            if [ "$ts" -gt "$latest_ts" ]; then latest_ts=$ts; latest=$z; fi
          done
          [ -n "$latest" ] || { echo "No zip found in repository root"; exit 1; }
          echo "Deploying $latest (committed $(date -u -d @$latest_ts))"
          mkdir -p _site && unzip -q -o "$latest" -d _site
          [ -f _site/index.html ] || { echo "zip has no index.html at its root"; exit 1; }
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
